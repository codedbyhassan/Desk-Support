workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build (No Signing)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      
      - name: Install Capacitor
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      
      - name: Build web app
        script: |
          npm run build
      
      - name: Add iOS platform
        script: |
          npx cap add ios || echo "iOS platform already exists"
      
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      
      - name: Disable code signing in Xcode project
        script: |
          cd ios/App
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj
      
      - name: Build unsigned iOS app
        script: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""
      
      - name: Create IPA from app bundle
        script: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r DeskSupport.ipa Payload
          mv DeskSupport.ipa ../../../../../
    
    artifacts:
      - DeskSupport.ipa
      - ios/App/build/Build/Products/Debug-iphoneos/App.app
    
    publishing:
      email:
        recipients:
          - poundsghst@gmail.com
        notify:
          success: true
          failure: false