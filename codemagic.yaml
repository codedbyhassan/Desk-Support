workflows:
  ios-capacitor-build:
    name: iOS Capacitor Build (Signed)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.yourcompany.desksupport  # Change this to your bundle ID
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      
      - name: Install Capacitor
        script: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      
      - name: Build web app
        script: |
          npm run build
      
      - name: Add iOS platform
        script: |
          npx cap add ios || echo "iOS platform already exists"
      
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      
      - name: Update Bundle Identifier
        script: |
          cd ios/App
          # Update bundle identifier in project settings
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.yourcompany.desksupport;/g' App.xcodeproj/project.pbxproj
      
      - name: Build and sign iOS app
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive
          
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR \
            -exportOptionsPlist $CM_EXPORT_OPTIONS
      
    artifacts:
      - "*.ipa"
    
    publishing:
      email:
        recipients:
          - poundsghst@gmail.com
        notify:
          success: true
          failure: false